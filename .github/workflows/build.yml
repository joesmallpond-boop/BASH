name: Build

# Every push: tests on Linux (cheap) and the Windows build.
# Mac (DMG) and iPad builds run on version tags or when started by hand
# (Actions tab > Build > Run workflow), because private-repo macOS minutes
# are billed at 10x. Or build on your own Mac with scripts/build-mac.sh.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      mac:
        description: "Build the Mac DMG and the iPad compile check"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBASH_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build -j 4 --target bash_core_tests bash_plugin_tests BASH_VST3

      - name: Core tests
        run: ./build/bash_core_tests

      - name: Plugin tests
        run: xvfb-run -a ./build/bash_plugin_tests

  windows:
    name: Windows (VST3, Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release -j 4 --target bash_core_tests BASH_VST3 BASH_Standalone

      - name: Core tests
        run: ./build/Release/bash_core_tests.exe

      - name: Package
        shell: pwsh
        run: |
          $art = "build/plugin/BASH_artefacts/Release"
          New-Item -ItemType Directory -Force -Path win | Out-Null
          Copy-Item -Recurse "$art/VST3/BASH.vst3" win/
          Copy-Item "$art/Standalone/BASH.exe" win/
          Copy-Item packaging/INSTALL-windows.txt win/
          Compress-Archive -Path win/* -DestinationPath BASH-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BASH-windows
          path: BASH-windows.zip

  macos:
    name: macOS (VST3, AU, Standalone)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mac)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, test and package
        run: ./scripts/build-mac.sh --no-install

      - uses: actions/upload-artifact@v4
        with:
          name: BASH-mac
          path: BASH-mac.dmg

  ios:
    name: iPad (AUv3 + app, simulator compile check)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mac)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DBASH_BUILD_TESTS=OFF
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=

      - name: Build (simulator, unsigned)
        run: cmake --build build-ios --config Release --target BASH_AUv3 BASH_Standalone -- -sdk iphonesimulator -arch arm64 -quiet

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BASH-mac/BASH-mac.dmg
            dist/BASH-windows/BASH-windows.zip
