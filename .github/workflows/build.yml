name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (VST3, AU, Standalone)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBASH_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release -j 4 --target bash_core_tests bash_plugin_tests BASH_VST3 BASH_AU BASH_Standalone

      - name: Core tests
        run: ./build/bash_core_tests

      - name: Plugin tests
        run: ./build/bash_plugin_tests

      - name: Ad-hoc sign and package DMG
        run: |
          set -e
          ART=build/plugin/BASH_artefacts/Release
          mkdir -p dmg
          cp -R "$ART/VST3/BASH.vst3"      dmg/
          cp -R "$ART/AU/BASH.component"   dmg/
          cp -R "$ART/Standalone/BASH.app" dmg/
          for b in dmg/BASH.vst3 dmg/BASH.component dmg/BASH.app; do
            codesign --force --deep --sign - "$b"
          done
          cp packaging/INSTALL-mac.txt dmg/
          hdiutil create -volname "BASH!" -srcfolder dmg -ov -format UDZO BASH-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: BASH-mac
          path: BASH-mac.dmg

  windows:
    name: Windows (VST3, Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release -j 4 --target bash_core_tests BASH_VST3 BASH_Standalone

      - name: Core tests
        run: ./build/Release/bash_core_tests.exe

      - name: Package
        shell: pwsh
        run: |
          $art = "build/plugin/BASH_artefacts/Release"
          New-Item -ItemType Directory -Force -Path win | Out-Null
          Copy-Item -Recurse "$art/VST3/BASH.vst3" win/
          Copy-Item "$art/Standalone/BASH.exe" win/
          Copy-Item packaging/INSTALL-windows.txt win/
          Compress-Archive -Path win/* -DestinationPath BASH-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BASH-windows
          path: BASH-windows.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BASH-mac/BASH-mac.dmg
            dist/BASH-windows/BASH-windows.zip
