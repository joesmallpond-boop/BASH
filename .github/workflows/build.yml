name: Build

# Every push: core tests, the device generated + checked, display previews and a
# compile check of the bash~ external (Linux, cheap). The Mac build (external +
# installer) runs on version tags or when started by hand (Actions tab > Build >
# Run workflow), because private-repo macOS minutes are billed at 10x.
# Or build on your own Mac with scripts/build-mac.sh.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      mac:
        description: "Build the Mac installer (DMG)"
        type: boolean
        default: true
      release:
        description: "Publish the build as a GitHub Release (version from CMakeLists.txt)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  MAX_SDK_COMMIT: c03a2922a2a8ff149165a1e2ea134e9321d6e202

jobs:
  tests:
    name: Tests + device checks (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ./build/bash_core_tests

      - name: Generate and check the device
        run: |
          ./build/bash_params_json > build/params.json
          for v in full voice seq; do python3 max/make_device.py build/params.json build/device "$v"; done
          python3 max/check_device.py "build/device/BASH!.maxpat" build/device/bash_ui.js max/javascript
          python3 max/check_device.py "build/device/BASH! Voice.maxpat" build/device/bash_ui_voice.js max/javascript
          python3 max/check_device.py "build/device/BASH! Sequencer.maxpat" build/device/bash_ui_seq.js max/javascript

      - name: Display scripts (ES5 + previews)
        run: |
          mkdir -p build/node && cd build/node && npm init -y >/dev/null && npm install acorn@8.14.0 @napi-rs/canvas@0.1.65 >/dev/null && cd ../..
          export NODE_PATH="$PWD/build/node/node_modules"
          node max/check_es5.js max/javascript/*.js build/device/bash_ui*.js
          for s in synth slice drum step; do ./build/bash_device_sim $s > build/sim_$s.jsonl; node max/preview.js "build/device/BASH!.maxpat" max/javascript build/device/bash_ui.js build/sim_$s.jsonl build/preview-$s.png 0; done
          ./build/bash_device_sim mod > build/sim_mod.jsonl
          node max/preview.js "build/device/BASH!.maxpat" max/javascript build/device/bash_ui.js build/sim_mod.jsonl build/preview-mod.png 1
          ./build/bash_device_sim seq > build/sim_seq.jsonl
          node max/preview.js "build/device/BASH! Sequencer.maxpat" max/javascript build/device/bash_ui_seq.js build/sim_seq.jsonl build/preview-sequencer.png 1
          node max/preview.js "build/device/BASH! Voice.maxpat" max/javascript build/device/bash_ui_voice.js build/sim_drum.jsonl build/preview-voice.png 0

      - name: bash~ compile check
        run: |
          git clone -q https://github.com/Cycling74/max-sdk-base.git build/max-sdk-base
          git -C build/max-sdk-base checkout -q "$MAX_SDK_COMMIT"
          cmake -S max -B build/max -DMAX_SDK_BASE="$PWD/build/max-sdk-base" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/max -j 4

      - uses: actions/upload-artifact@v4
        with:
          name: BASH-previews
          path: build/preview-*.png

  macos:
    name: macOS (Max for Live device)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mac)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Build, test and package
        run: ./scripts/build-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BASH-mac
          path: BASH-mac.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mac && inputs.release)
    needs: [tests, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver   # the version in CMakeLists.txt names manual releases
        run: echo "tag=v$(sed -n 's/^project(BASH VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          name: BASH! ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            **BASH! by Kalabash, for Ableton Live (Max for Live, Mac):** BASH!, BASH! Voice and BASH! Sequencer. Download BASH-mac.dmg, quit Live, open the DMG and double-click "Install BASH!.pkg". If macOS blocks it, right-click the .pkg > Open.
            Or drag the Kalabash folder from the DMG into your Live User Library. Then in Live: User Library > Kalabash.
          files: |
            dist/BASH-mac/BASH-mac.dmg
